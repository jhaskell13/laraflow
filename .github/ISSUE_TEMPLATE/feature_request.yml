name: Feature request
description: A capability the roadmap should carry, or carry sooner
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to run durably, and why today's primitives — conditions, waits, signals, sub-workflows, fan-out, compensation, retries, schedules — do not cover it.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The shape you would want
      description: An example workflow or step as you would write it.
      render: php
  - type: textarea
    id: semantics
    attributes:
      label: Semantics that matter
      description: Every feature needs persistence, recovery, and observability semantics before implementation. What should happen on worker loss, retry, cancellation, or re-execution?
  - type: textarea
    id: roadmap
    attributes:
      label: Where it sits on the roadmap
      description: Which milestone in ROADMAP.md it belongs to, or why it belongs on the roadmap at all. A connector for a service belongs in a package of its own (docs/community-connectors.md).
