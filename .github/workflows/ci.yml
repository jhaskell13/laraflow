name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow re-run the whole matrix against the tag
  # before anything is drafted.
  workflow_call:

# Read-only by default. Nothing here writes to the repository, and the
# matrix runs `composer update` — third-party code, resolved fresh —
# with whatever the token can do; a caller (release.yml) can only ever
# narrow this further, never widen it.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress there.
# Main and tag runs are never cancelled: each is the record of a commit.
# Prefixed so a calling workflow's group, should it ever set one, can
# not collide with this one and deadlock the call.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, static analysis, and package hygiene run once: they read the
  # source, not the matrix, so repeating them per cell buys nothing.
  quality:
    name: Quality (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      # Composer's download cache, not vendor/: a stale vendor would
      # mask a resolution change, a warm download cache only skips the
      # network. Keyed on everything that changes what gets resolved.
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-lock-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.4-lock-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Audits the committed lock file, which pins this repository's
      # development set. Applications never install it — composer.lock
      # is export-ignored and a library's lock is ignored by consumers
      # anyway; they resolve composer.json's constraints themselves. So
      # this proves the set CI tests with, not what any app will get.
      # The prefer-lowest leg below deliberately resolves old dev
      # dependencies and would always fail an audit.
      - name: Audit dependencies
        run: composer audit

      - name: Code style
        run: composer lint

      - name: Static analysis
        run: composer analyse -- --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # One row per supported Laravel major, pinned through Testbench:
        # Testbench 10 is the Laravel 12 series, 11 the Laravel 13 one.
        laravel: ['12', '13']
        dependencies: [prefer-stable]
        exclude:
          # Laravel 13 requires PHP 8.3; the combination does not exist.
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
          # The floor of every declared constraint, resolved as low as
          # the dev dependencies allow, on the oldest supported PHP:
          # proves the ^-constraints in composer.json are honest.
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            dependencies: prefer-lowest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      # Composer's download cache, not vendor/: a stale vendor would
      # mask a resolution change, a warm download cache only skips the
      # network. Keyed on everything that changes what gets resolved.
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Pin the Laravel major via Testbench
        run: >
          composer require --dev --no-update --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies (prefer-stable)
        if: matrix.dependencies == 'prefer-stable'
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Install dependencies (prefer-lowest)
        if: matrix.dependencies == 'prefer-lowest'
        run: composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Tests
        run: composer test

      # The analysis must hold on the floor as well as the lock: stub
      # and signature drift between dependency versions is a real
      # compatibility failure, found exactly this way in development.
      - name: Static analysis (prefer-lowest)
        if: matrix.dependencies == 'prefer-lowest'
        run: composer analyse -- --no-progress

  # The engine matrix: the whole suite against every database the
  # compatibility policy names, through the LARAFLOW_TEST_DB_* seam, at
  # both ends of the dependency axis — Laravel 13 on the lock file, and
  # Laravel 12 resolved to the floor of every constraint on the oldest
  # supported PHP — and then the install walk against the same engine.
  # Full coverage over CI weight, decided at Milestone 8 planning: the
  # engines are where new code has found its defects every time.
  #
  # One shared env block configures every image — each ignores the
  # variables that are not its own — and health options come from the
  # matrix because every engine answers "are you up" differently.
  databases:
    name: Database (${{ matrix.name }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each engine's supported floor and, where the vendor has moved
        # on, its current release: the floor proves the documented
        # minimum, the current one catches what a new release changed.
        # Floors follow docs/compatibility.md's drop policy — raised in
        # 0.6.0 when MySQL 8.0, MariaDB 10.6, PostgreSQL 13, and SQL
        # Server 2019's mainstream support ended.
        db: [mysql-8.4, mariadb-10.11, mariadb-11.4, pgsql-14, pgsql-17, sqlsrv-2022]
        laravel: ['12', '13']
        include:
          # Each cell's image and the way to ask it whether it is up.
          # The engine name doubles as the Laravel connection the
          # install walk's application is pointed at. MySQL 8.4 is both
          # floor and LTS; the 9.x innovation line is not a support
          # target. MariaDB 11 images no longer carry the mysql* client
          # names, so its cells probe with the image's own
          # healthcheck.sh, and the install database is created with the
          # client named after the engine.
          - db: mysql-8.4
            engine: mysql
            name: MySQL 8.4
            image: mysql:8.4
            port: 3306
            extensions: pdo_mysql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - db: mariadb-10.11
            engine: mariadb
            name: MariaDB 10.11
            image: mariadb:10.11
            port: 3306
            extensions: pdo_mysql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="healthcheck.sh --connect --innodb_initialized"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - db: mariadb-11.4
            engine: mariadb
            name: MariaDB 11.4
            image: mariadb:11.4
            port: 3306
            extensions: pdo_mysql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="healthcheck.sh --connect --innodb_initialized"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - db: pgsql-14
            engine: pgsql
            name: PostgreSQL 14
            image: postgres:14
            port: 5432
            extensions: pdo_pgsql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="pg_isready -U laraflow"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - db: pgsql-17
            engine: pgsql
            name: PostgreSQL 17
            image: postgres:17
            port: 5432
            extensions: pdo_pgsql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="pg_isready -U laraflow"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - db: sqlsrv-2022
            engine: sqlsrv
            name: SQL Server 2022
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            extensions: pdo_sqlsrv
            username: sa
            password: "Laraflow!Passw0rd"
            # No docker health probe: where sqlcmd lives inside the image
            # moved between CUs (mssql-tools vs mssql-tools18), so the
            # wait step below asks from outside, trying both.
            options: --env MSSQL_PID=Developer
          # The two ends of the dependency axis, the same pairings the
          # SQLite install job has always used.
          - laravel: '12'
            php: '8.2'
            testbench: '^10.0'
            dependencies: prefer-lowest
          - laravel: '13'
            php: '8.4'
            testbench: '^11.0'
            dependencies: prefer-stable

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laraflow_test
          MYSQL_USER: laraflow
          MYSQL_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laraflow_test
          MARIADB_USER: laraflow
          MARIADB_PASSWORD: secret
          POSTGRES_DB: laraflow_test
          POSTGRES_USER: laraflow
          POSTGRES_PASSWORD: secret
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Laraflow!Passw0rd"
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.options }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json, ${{ matrix.extensions }}
          coverage: none

      # Composer's download cache, not vendor/: a stale vendor would
      # mask a resolution change, a warm download cache only skips the
      # network. Keyed on everything that changes what gets resolved.
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ matrix.dependencies }}-

      - name: Pin the Laravel major via Testbench
        run: >
          composer require --dev --no-update --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies (prefer-stable)
        if: matrix.dependencies == 'prefer-stable'
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Install dependencies (prefer-lowest)
        if: matrix.dependencies == 'prefer-lowest'
        run: composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress

      # pdo_sqlsrv is a shim over Microsoft's ODBC driver, which the
      # runner image does not carry; without it every connection fails
      # with IMSSP before reaching the server.
      - name: Install the Microsoft ODBC driver
        if: matrix.engine == 'sqlsrv'
        # The runner image already carries Microsoft's apt repository,
        # so adding it again only conflicts with the existing keyring.
        run: |
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18

      # SQL Server creates no database from environment variables the
      # way the other images do, and its startup is the slowest of the
      # four. Wait for it and create both databases in one idempotent
      # loop, trying both sqlcmd locations the image has shipped.
      - name: Wait for SQL Server and create the databases
        if: matrix.engine == 'sqlsrv'
        run: |
          QUERY="IF DB_ID('laraflow_test') IS NULL CREATE DATABASE laraflow_test; IF DB_ID('laraflow_install') IS NULL CREATE DATABASE laraflow_install"
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.database.id }} sh -c \
              "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Laraflow!Passw0rd' -Q \"$QUERY\" -b \
               || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Laraflow!Passw0rd' -Q \"$QUERY\" -b"; then
              echo "SQL Server is ready."; exit 0
            fi
            sleep 5
          done
          echo "SQL Server never became ready; container log follows."
          docker logs ${{ job.services.database.id }}
          exit 1

      # The suite leaves laraflow_test migrated and the install walk
      # must start from nothing, as a new application does; the images
      # create one database from their environment, so the second is
      # created from inside the container, with the client each ships.
      - name: Create a database for the install walk
        if: matrix.engine != 'sqlsrv'
        run: |
          case "${{ matrix.engine }}" in
            mysql|mariadb)
              docker exec ${{ job.services.database.id }} ${{ matrix.engine }} -uroot -proot \
                -e "CREATE DATABASE laraflow_install; GRANT ALL ON laraflow_install.* TO 'laraflow'@'%';" ;;
            pgsql)
              docker exec ${{ job.services.database.id }} psql -U laraflow -d laraflow_test \
                -c "CREATE DATABASE laraflow_install" ;;
          esac

      - name: Tests
        env:
          LARAFLOW_TEST_DB_DRIVER: ${{ matrix.engine }}
          LARAFLOW_TEST_DB_HOST: 127.0.0.1
          LARAFLOW_TEST_DB_PORT: ${{ matrix.port }}
          LARAFLOW_TEST_DB_DATABASE: laraflow_test
          LARAFLOW_TEST_DB_USERNAME: ${{ matrix.username }}
          LARAFLOW_TEST_DB_PASSWORD: ${{ matrix.password }}
        run: composer test

      # The third Milestone 8 exit criterion, against this engine: a
      # fresh application, pointed at the second database through the
      # same DB_* variables a user would set. The skeleton leaves SQL
      # Server's certificate settings commented out, and the ODBC driver
      # refuses a container's self-signed certificate by default, so
      # that one is configured through DB_URL — the documented way to
      # pass a connection option the skeleton does not name.
      - name: Install walk
        uses: ./.github/actions/install-walk
        env:
          DB_CONNECTION: ${{ matrix.engine }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: laraflow_install
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}
          DB_URL: ${{ matrix.engine == 'sqlsrv' && format('sqlsrv://{0}:{1}@127.0.0.1:{2}/laraflow_install?encrypt=yes&trust_server_certificate=true', matrix.username, matrix.password, matrix.port) || '' }}
        with:
          laravel: ${{ matrix.laravel }}

  # The install walk on SQLite, the database a new application has
  # before it has chosen one: the oldest supported pairing and the
  # newest, through the same action the engine jobs end with.
  install:
    name: Install (SQLite, Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12'
            php: '8.2'
          - laravel: '13'
            php: '8.4'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      # Composer's download cache, not vendor/: a stale vendor would
      # mask a resolution change, a warm download cache only skips the
      # network. Keyed on everything that changes what gets resolved.
      - name: Locate the Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-install-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-install-

      - name: Install walk
        uses: ./.github/actions/install-walk
        with:
          laravel: ${{ matrix.laravel }}
