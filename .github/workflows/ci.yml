name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint, static analysis, and package hygiene run once: they read the
  # source, not the matrix, so repeating them per cell buys nothing.
  quality:
    name: Quality (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Audits the committed lock file — the set applications actually
      # install. The prefer-lowest leg below deliberately resolves old
      # dev dependencies and would always fail an audit.
      - name: Audit dependencies
        run: composer audit

      - name: Code style
        run: composer lint

      - name: Static analysis
        run: composer analyse -- --no-progress

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # One row per supported Laravel major, pinned through Testbench:
        # Testbench 10 is the Laravel 12 series, 11 the Laravel 13 one.
        laravel: ['12', '13']
        dependencies: [prefer-stable]
        exclude:
          # Laravel 13 requires PHP 8.3; the combination does not exist.
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
          # The floor of every declared constraint, resolved as low as
          # the dev dependencies allow, on the oldest supported PHP:
          # proves the ^-constraints in composer.json are honest.
          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'
            dependencies: prefer-lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json
          coverage: none

      - name: Pin the Laravel major via Testbench
        run: >
          composer require --dev --no-update --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies (prefer-stable)
        if: matrix.dependencies == 'prefer-stable'
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress

      - name: Install dependencies (prefer-lowest)
        if: matrix.dependencies == 'prefer-lowest'
        run: composer update --prefer-dist --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Tests
        run: composer test

      # The analysis must hold on the floor as well as the lock: stub
      # and signature drift between dependency versions is a real
      # compatibility failure, found exactly this way in development.
      - name: Static analysis (prefer-lowest)
        if: matrix.dependencies == 'prefer-lowest'
        run: composer analyse -- --no-progress

  # The engine matrix: the whole suite against every database the
  # compatibility policy names, through the LARAFLOW_TEST_DB_* seam.
  # One shared env block configures every image — each ignores the
  # variables that are not its own — and health options come from the
  # matrix because every engine answers "are you up" differently.
  databases:
    name: Database (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            driver: mysql
            image: mysql:8.0
            port: 3306
            extensions: pdo_mysql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - name: MariaDB 10.6
            driver: mariadb
            image: mariadb:10.6
            port: 3306
            extensions: pdo_mysql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - name: PostgreSQL 13
            driver: pgsql
            image: postgres:13
            port: 5432
            extensions: pdo_pgsql
            username: laraflow
            password: secret
            options: >-
              --health-cmd="pg_isready -U laraflow"
              --health-interval=5s --health-timeout=5s --health-retries=20
          - name: SQL Server 2019
            driver: sqlsrv
            image: mcr.microsoft.com/mssql/server:2019-latest
            port: 1433
            extensions: pdo_sqlsrv
            username: sa
            password: "Laraflow!Passw0rd"
            # No docker health probe: where sqlcmd lives inside the image
            # moved between CUs (mssql-tools vs mssql-tools18), so the
            # wait step below asks from outside, trying both.
            options: --env MSSQL_PID=Developer

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laraflow_test
          MYSQL_USER: laraflow
          MYSQL_PASSWORD: secret
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: laraflow_test
          MARIADB_USER: laraflow
          MARIADB_PASSWORD: secret
          POSTGRES_DB: laraflow_test
          POSTGRES_USER: laraflow
          POSTGRES_PASSWORD: secret
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Laraflow!Passw0rd"
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.options }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, json, ${{ matrix.extensions }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # pdo_sqlsrv is a shim over Microsoft's ODBC driver, which the
      # runner image does not carry; without it every connection fails
      # with IMSSP before reaching the server.
      - name: Install the Microsoft ODBC driver
        if: matrix.driver == 'sqlsrv'
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          echo "deb [arch=amd64] https://packages.microsoft.com/ubuntu/$(lsb_release -rs)/prod $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -qq
          sudo ACCEPT_EULA=Y apt-get install -y -qq msodbcsql18

      # SQL Server creates no database from environment variables the
      # way the other images do, and its startup is the slowest of the
      # four. Wait for it and create the database in one idempotent
      # loop, trying both sqlcmd locations the image has shipped.
      - name: Wait for SQL Server and create the database
        if: matrix.driver == 'sqlsrv'
        run: |
          QUERY="IF DB_ID('laraflow_test') IS NULL CREATE DATABASE laraflow_test"
          for i in $(seq 1 60); do
            if docker exec ${{ job.services.database.id }} sh -c \
              "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Laraflow!Passw0rd' -Q \"$QUERY\" -b \
               || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Laraflow!Passw0rd' -Q \"$QUERY\" -b"; then
              echo "SQL Server is ready."; exit 0
            fi
            sleep 5
          done
          echo "SQL Server never became ready; container log follows."
          docker logs ${{ job.services.database.id }}
          exit 1

      - name: Tests
        env:
          LARAFLOW_TEST_DB_DRIVER: ${{ matrix.driver }}
          LARAFLOW_TEST_DB_HOST: 127.0.0.1
          LARAFLOW_TEST_DB_PORT: ${{ matrix.port }}
          LARAFLOW_TEST_DB_DATABASE: laraflow_test
          LARAFLOW_TEST_DB_USERNAME: ${{ matrix.username }}
          LARAFLOW_TEST_DB_PASSWORD: ${{ matrix.password }}
        run: composer test
