# Fires on a version tag, re-proves the entire CI matrix against the
# tagged commit, and drafts a GitHub release whose notes are that
# version's CHANGELOG.md section. Drafts only: publishing is a human
# decision, and a failed matrix means no draft at all.
#
# The tag is only valid if the changelog already has its section —
# cutting a release converts Unreleased first (see CONTRIBUTING.md).
name: Release

on:
  push:
    # Version tags only — v1.2.3 and v1.2.3-rc.1 — so a stray `vnext`
    # or `v-test` tag cannot start a release. Filter syntax, not regex:
    # `+` repeats the class before it, `.` is literal.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

# Read-only for everything, including the reusable CI call, whose matrix
# runs `composer update` on freshly resolved third-party code: a called
# workflow's token can be no wider than this. Only the draft job, which
# runs nothing but this repository's own script and `gh`, may write.
permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / { inside = substr($0, 1, length("## [" ver "]")) == "## [" ver "]"; next }
            inside
          ' CHANGELOG.md | grep -v '^\[.*\]: ' > RELEASE_NOTES.md || true
          if ! test -s RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no [$VERSION] section. Convert Unreleased to [$VERSION] before tagging (see CONTRIBUTING.md, Cutting a release)."
            exit 1
          fi
          echo "Notes: $(wc -l < RELEASE_NOTES.md) lines."

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
