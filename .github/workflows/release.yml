# Fires on a version tag, re-proves the entire CI matrix against the
# tagged commit, and drafts a GitHub release whose notes are that
# version's CHANGELOG.md section. Drafts only: publishing is a human
# decision, and a failed matrix means no draft at all.
#
# The tag is only valid if the changelog already has its section —
# cutting a release converts Unreleased first (see CONTRIBUTING.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's changelog section
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## / { inside = substr($0, 1, length("## [" ver "]")) == "## [" ver "]"; next }
            inside
          ' CHANGELOG.md | grep -v '^\[.*\]: ' > RELEASE_NOTES.md || true
          if ! test -s RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no [$VERSION] section. Convert Unreleased to [$VERSION] before tagging (see CONTRIBUTING.md, Cutting a release)."
            exit 1
          fi
          echo "Notes: $(wc -l < RELEASE_NOTES.md) lines."

      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --draft
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file RELEASE_NOTES.md
