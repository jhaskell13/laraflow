# Configuration for the local playground (`vendor/bin/testbench`).
# See the "Try it locally" section of the README.

providers:
  - Laraflow\Core\LaraflowServiceProvider
  # Playground-only: WAL and a busy timeout, so a worker, a traffic
  # generator, and a watch command can share one SQLite file.
  - Workbench\App\Providers\PlaygroundServiceProvider

workbench:
  # Discovers workbench/app/Console/Commands — the playground:* commands.
  # They live there rather than in src/ because a traffic generator has
  # no business being installable into an application.
  discovers:
    commands: true

env:
  - DB_CONNECTION=sqlite
  # A real queue, not `sync`: dispatched executions wait in the `jobs`
  # table until `vendor/bin/testbench queue:work` picks them up, so the
  # playground demonstrates asynchronous execution, duplicate-delivery
  # safety, and delayed retry delivery the way an application would.
  - QUEUE_CONNECTION=database
